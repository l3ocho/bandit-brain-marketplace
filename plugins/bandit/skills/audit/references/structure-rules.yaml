# Structure rules as data. The prose and the why live in structure-rulebook.md.
# Change a rule → change both in the same approved proposal, and keep
# `rulebook_updated` equal to the rulebook's `updated:` frontmatter.
# check_structure.py refuses to run when they differ.
schema: 2
rulebook_updated: 2026-11-24

levels:            # must → ❌ on a break · should → ⚠️
  S1: must
  S2: must
  S3: must
  S4: must
  S6: should
  S9: must         # added 2026-09-28 as a preventive must (rulebook: Changing this rulebook)
  S12: must        # working folder of a project in Claude Code without dev: true; added 2026-09-29
  S13: should      # a sprint card's brief carries its sprint's tag; added 2026-10-09
  # Retired, numbers not reused: S5, S7, S8, S10, S11 (2026-11-22, with the settings folder and the
  # second copy for another surface) · S14, S15, S16 (2026-11-20)

paths:
  snapshots: ".audit"   # snapshots: this folder at the root of the folder Claude Code runs from (2026-11-20)

stamps:
  # The self-check stamps: one note per domain on its workflow project's board, one section per project.
  note_title: "{domain}-audit-stamps"   # {domain} as a slug
  max_age_days: 30                        # older → an Unchecked line asking for a new check; still scored

exempt:
  system_owner: true          # boards with a systemOwner are listed, never scored

names:
  claude_prefix: "{L} - "     # Claude.ai only; stripped before S2 compares
  workflow_suffix: " - wkflw" # workflow board only
  banned_board_patterns:      # S2: no other prefixes or suffixes on boards
    - "^(App|APP|DBT):"
    - "flow$"

workflow:
  board_profile: workflow   # the board's profile (2026-10-29)
  project_type: workflow
  # Decision 2026-09-27 (option C): a workflow project's board: line names its
  # own `- wkflw` board. Its wider, limited scope comes from type: workflow.
  context_board_is_wkflw: true

project_context:
  required_keys: [domain, project, type, board, prefix]
  optional_keys: [dev, notes]
  # Strings, not booleans: the stamp stores Project Context values as text.
  dev_values: ["true"]
  notes_values: ["none", "app"]   # `none` = the helpers keep no notes for it; `app` = the older way to say the default; no line = the app's Notes (2026-11-22)
  types: [product_service, workflow, claude_marketplace]
  # S4: `project "…"` naming an existing board, or `none`.
  # `folder "…"`, `global` and `pending` do not pass (rulebook 2026-09-27).
  board_forms: [project, none]
  # S4: the home board is filed in the domain's board folder or a subfolder of it (2026-10-14)
  board_in_domain: true
  prefix_pattern: "^([a-z]{2,3}|none)$"   # S4: short prefix, never a full name

version:
  # The running version is the first token after **Version:**.
  # "4.2.1 · **Last Updated:** 2026-09-26" → 4.2.1 · "8 (file …)" → 8
  token: first

s12:
  # Working folder of a project that runs in Claude Code without dev: true. The guard's
  # constants (bandit:project scripts/workdir.py) mirror this block: change both.
  hook_file: .claude/hooks/workdir.py
  hook_sha12: 203b01d9ceab          # sha256[:12] of bandit:project's scripts/workdir.py; a copy that differs is outdated
  settings_file: .claude/settings.json
  hook_events: [PreToolUse, SessionStart]   # each needs a command hook running hook_script
  hook_script: workdir.py
  manifest: ".claude/workdir-manifest.json"   # written by the guard at session start, read by `check` in the folder; missing → unchecked
  manifest_max_age_days: 7          # older → unchecked
  root_allowed: [CLAUDE.md, REFERENCE.md, .claude, repos, work, data, scratch, _closed, _backup]   # plus hosted projects (own CLAUDE.md)
  task_dirs: [work, data, _closed]  # only {prefix}-{task} folders inside, no loose files
  task_folder_pattern: "^{prefix}-[a-z0-9]+(-[a-z0-9]+)*$"
  data_extensions: [.csv, .tsv, .xls, .xlsx, .xlsm, .parquet, .feather, .jsonl, .ndjson, .db, .sqlite, .sqlite3, .duckdb]
  retention_days: {scratch: 7, _closed: 30}   # older → a delete row, run with the audit
  backup_dir: _backup               # settings rollback copies only, flat, no retention clock; never work
  backup_name_pattern: "^(CLAUDE\\.md|REFERENCE\\.md|settings\\.json|workdir\\.py)\\..+$"

sprint_briefs:
  # S13. The conventions are bandit:notes'; bandit-dev:sprint's local checker reads a notes file
  # (its SP2 is the same rule at write time). The brief carries the tag sprint-{name}.
  sprint_tag_prefix: "sprint/"      # sprint {name} (a real sprint, or its old card tag sprint/{name}) ↔ sprint-{name}
  brief_kind: brief                 # a note of this kind, with a card in a sprint

s9:
  # Dev board shape. With `dev: true`: every lane tag has a lane, the first lane is
  # Incident, and every tag below exists. Without it: no lane matches any of them.
  first_lane_tag: lane/incident
  lane_tags: [lane/incident, lane/issue, lane/feature, lane/maintenance, lane/content, lane/tech-debt]
  stage_tags: [stage/spec, stage/planned, stage/ready]
  dev_profile: technical     # with `dev: true` the board's profile (2026-10-29)

owners:
  board_rename: bandit:tasks
  board_profile: bandit:tasks
  board_folder_rename: bandit:tasks
  dev_board_shape: bandit:tasks
  context_update: bandit:project (/bandit:project audit in the project)
  claude_rename: the user (by hand)
  self_check: the user (/bandit:audit check in the project)
  decide: the user
  workdir_guard: bandit:project (/bandit:project audit in the project)     # S12: guard missing or outdated
  workdir_fix: Claude Code in the project   # S12: layout rows, run in the project's own session
  brief_tag: bandit:notes             # S13: tag the brief sprint-{name} (notes_set_fields)

row_order: [bandit:notes, bandit:project (/bandit:project audit in the project), bandit:tasks, Claude Code in the project, the user (by hand), the user (/bandit:audit check in the project), the user]
